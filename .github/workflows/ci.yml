name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  # ── Rust core tests (fast, no native builds) ─────────────────────
  test-core:
    name: Test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --package dicelet-core

  # ── Build napi native modules + smoke test per platform ──────────
  build-napi:
    name: Build & Test (${{ matrix.settings.target }})
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ── Windows ──
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            node-file: dicelet.win32-x64-msvc.node

          # ── Linux x64 gnu ──
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-file: dicelet.linux-x64-gnu.node

          # ── Linux x64 musl ──
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            node-file: dicelet.linux-x64-musl.node
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            cross: true

          # ── Linux ARM64 gnu (cross-compile) ──
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            node-file: dicelet.linux-arm64-gnu.node
            cross: true
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.settings.setup != ''
        run: ${{ matrix.settings.setup }}
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        working-directory: crates/dicelet-napi
        run: npm install

      - name: Build native module
        working-directory: crates/dicelet-napi
        run: |
          if [ "${{ matrix.settings.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            npx napi build --platform --release --target ${{ matrix.settings.target }}
          elif [ "${{ matrix.settings.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CC_x86_64_unknown_linux_musl=musl-gcc
            npx napi build --platform --release --target ${{ matrix.settings.target }}
          else
            npx napi build --platform --release
          fi
        shell: bash

      - name: Smoke test (native platform only)
        if: matrix.settings.cross != true
        working-directory: crates/dicelet-napi
        run: node test.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.node-file }}
          path: crates/dicelet-napi/${{ matrix.settings.node-file }}

  # ── Build Python (PyO3) + test ───────────────────────────────────
  build-python:
    name: Build & Test (Python)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin pytest

      - name: Create virtualenv
        working-directory: crates/dicelet-python
        run: python -m venv .venv

      - name: Build and install (dev)
        working-directory: crates/dicelet-python
        run: |
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop

      - name: Run tests
        working-directory: crates/dicelet-python
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v

  # ── Build WASM + test ────────────────────────────────────────────
  build-wasm:
    name: Build & Test (WASM)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: crates/dicelet-wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Test WASM (Node.js)
        working-directory: crates/dicelet-wasm
        run: wasm-pack test --node

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dicelet-wasm
          path: crates/dicelet-wasm/pkg/
