name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'

jobs:
  # ── Version consistency check ────────────────────────────────────
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.npm-check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency across all packages
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          ROOT_NPM_VER=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          NAPI_NPM_VER=$(python3 -c "import json; print(json.load(open('crates/dicelet-napi/package.json'))['version'])")

          echo "Cargo.toml (source of truth):  $CARGO_VER"
          echo "package.json (npm):           $ROOT_NPM_VER"
          echo "napi package.json:            $NAPI_NPM_VER"

          fail=0
          if [ "$CARGO_VER" != "$ROOT_NPM_VER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) != root package.json ($ROOT_NPM_VER)"
            fail=1
          fi
          if [ "$CARGO_VER" != "$NAPI_NPM_VER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) != napi package.json ($NAPI_NPM_VER)"
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            echo "::error::Version mismatch! Update all to match Cargo.toml [workspace.package].version"
            exit 1
          fi
          echo "All versions match: $CARGO_VER"
          echo "version=$CARGO_VER" >> $GITHUB_OUTPUT
        id: version

      - name: Check if version already published to npm
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if npm view dicelet@"$VER" version >/dev/null 2>&1; then
            echo "::warning::dicelet@$VER already exists on npm."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        id: npm-check

  # ── Rust core tests ──────────────────────────────────────────────
  test-core:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --package dicelet-core

  # ── Build napi native modules on all platforms ──────────────────
  build-npm:
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            node-file: dicelet.win32-x64-msvc.node

          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-file: dicelet.linux-x64-gnu.node

          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            node-file: dicelet.linux-arm64-gnu.node
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        working-directory: crates/dicelet-napi
        run: npm install

      - name: Build native module
        working-directory: crates/dicelet-napi
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          npx napi build --platform --release --target ${{ matrix.target }}
        shell: bash

      - name: Smoke test (native platform only)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: crates/dicelet-napi
        run: node test.js

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node-file }}
          path: crates/dicelet-napi/${{ matrix.node-file }}
          if-no-files-found: error

  # ── Publish npm: single package with all platform binaries ──────
  publish-npm:
    needs: [version-check, build-npm]
    if: needs.version-check.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all platform .node files
        uses: actions/download-artifact@v4
        with:
          pattern: dicelet.*
          path: native/
          merge-multiple: true

      - name: Bundle .node files into package
        run: |
          mkdir -p crates/dicelet-napi/bin
          find native/ -name "*.node" -exec cp -v {} crates/dicelet-napi/bin/ \;
          echo "--- Package bin/ contents ---"
          ls -la crates/dicelet-napi/bin/

      - name: Publish to npm
        working-directory: crates/dicelet-napi
        run: npm publish --provenance --access public

  # ── Python (PyO3) build wheels on all platforms via cibuildwheel ─
  pypi-wheels:
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up QEMU for Linux aarch64 emulation
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        run: |
          pip install cibuildwheel
          cibuildwheel --output-dir crates/dicelet-python/wheelhouse crates/dicelet-python
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_* pp* *_i686"
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: crates/dicelet-python/wheelhouse/*.whl

  # ── Python (PyO3) build sdist ─────────────────────────────────────
  pypi-sdist:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: crates/dicelet-python
        run: maturin build --release --sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: crates/dicelet-python/dist

  # ── Publish to PyPI ───────────────────────────────────────────────
  pypi-publish:
    needs: [pypi-wheels, pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # ── Create GitHub Release ─────────────────────────────────────────
  github-release:
    needs: [auto-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download npm artifacts for release assets
        uses: actions/download-artifact@v4
        with:
          pattern: dicelet.*
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: release-assets/*.node
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ── Auto tag (only after all publishes succeed) ──────────────────
  auto-tag:
    needs: [publish-npm, pypi-publish]
    if: needs.version-check.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$CARGO_VER"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi
